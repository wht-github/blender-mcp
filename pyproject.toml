[project]
name = "blender-agent"
version = "0.3.0"
description = "A local Streamable HTTP MCP bridge for Blender"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.28.1,<2",
]

[dependency-groups]
dev = [
    "ty>=0.0.28",
    "fake-bpy-module",
]
[tool.ty.environment]
python = ".venv"
